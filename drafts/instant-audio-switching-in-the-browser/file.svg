<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" aria-labelledby="t">
  <title id="t">Two mono audio tracks are stored as the left and right channels of one stereo track in a single video file</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .off { fill: #eef3fb; }
      .on { fill: #fdf1e3; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .lo { stroke: #3b6fb6; }
      .lon { stroke: #c9731a; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrow); }
      .frame { fill: none; stroke: #222; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="230" fill="#fff"/>
  <rect class="box off" x="20" y="24" width="170" height="44" rx="4"/>
  <text x="105.0" y="44.0" text-anchor="middle">audio, AI off</text>
  <text class="small" x="105.0" y="59.0" text-anchor="middle">mono</text>
  <rect class="box on" x="20" y="94" width="170" height="44" rx="4"/>
  <text x="105.0" y="114.0" text-anchor="middle">audio, AI on</text>
  <text class="small" x="105.0" y="129.0" text-anchor="middle">mono</text>
  <rect class="box" x="20" y="164" width="170" height="44" rx="4"/>
  <text x="105.0" y="190.0" text-anchor="middle">video</text>
  <rect class="frame" x="330" y="10" width="290" height="210" rx="6"/>
  <text x="475" y="30" text-anchor="middle">demo.mp4</text>
  <rect class="box" x="350" y="42" width="250" height="110" rx="4"/>
  <text class="small" x="475" y="58" text-anchor="middle">one stereo audio track</text>
  <rect class="box off" x="366" y="66" width="218" height="34" rx="4"/>
  <text x="475.0" y="87.0" text-anchor="middle">left channel = AI off</text>
  <rect class="box on" x="366" y="108" width="218" height="34" rx="4"/>
  <text x="475.0" y="129.0" text-anchor="middle">right channel = AI on</text>
  <rect class="box" x="350" y="164" width="250" height="44" rx="4"/>
  <text x="475.0" y="190.0" text-anchor="middle">video</text>
  <path class="line lo" d="M 190 46 L 260 46 L 260 83 L 364 83"/>
  <path class="line lon" d="M 190 116 L 260 116 L 260 125 L 364 125"/>
  <path class="line" d="M 190 186 L 348 186"/>
</svg>
