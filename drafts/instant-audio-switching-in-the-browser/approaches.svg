<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t">
  <title id="t">What the listener hears at the moment of the switch, for each approach: a hitch, drift, a long re-buffer, or a clean cut</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .barg { fill: #d9d9d9; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .thin { fill: none; stroke: #bbb; stroke-width: 1; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowg); }
      .curveb { fill: none; stroke: #4a78b8; stroke-width: 2.5; }
      .curveo { fill: none; stroke: #d98a2b; stroke-width: 2.5; }
      .dotb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .doto { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="260" fill="#fff"/>
  <text x="158.0" y="59.0" text-anchor="end">two files</text>
  <rect class="barb" x="170.0" y="40.0" width="210.0" height="28.0"/>
  <rect x="380" y="40" width="40" height="28" fill="#fff" stroke="#222" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="small" x="400.0" y="58.0" text-anchor="middle">hitch</text>
  <rect class="baro" x="420.0" y="40.0" width="200.0" height="28.0"/>
  <text x="158.0" y="103.0" text-anchor="end">two players</text>
  <rect class="barb" x="170.0" y="84.0" width="210.0" height="28.0"/>
  <rect class="baro" x="390.0" y="88.0" width="230.0" height="20.0"/>
  <text class="small" x="400.0" y="102.0" text-anchor="start">out of sync</text>
  <text x="158.0" y="147.0" text-anchor="end">HLS audio tracks</text>
  <rect class="barb" x="170.0" y="128.0" width="210.0" height="28.0"/>
  <rect x="380" y="128" width="150" height="28" fill="#fff" stroke="#222" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="small" x="455.0" y="146.0" text-anchor="middle">re-buffering</text>
  <rect class="baro" x="530.0" y="128.0" width="90.0" height="28.0"/>
  <text x="158.0" y="191.0" text-anchor="end">one stereo file</text>
  <rect class="barb" x="170.0" y="172.0" width="210.0" height="28.0"/>
  <rect class="baro" x="380.0" y="172.0" width="240.0" height="28.0"/>
  <path class="dash" d="M 380 30 L 380 222"/>
  <text class="small" x="380.0" y="240.0" text-anchor="middle">the switch</text>
  <rect class="barb" x="170.0" y="236.0" width="14.0" height="14.0"/>
  <text class="small" x="190.0" y="248.0" text-anchor="start">off</text>
  <rect class="baro" x="430.0" y="236.0" width="14.0" height="14.0"/>
  <text class="small" x="450.0" y="248.0" text-anchor="start">on</text>
</svg>
