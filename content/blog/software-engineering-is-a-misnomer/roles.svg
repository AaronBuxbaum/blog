<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="t">
  <title id="t">On a building site, someone designs and signs off, someone builds, and someone inspects; in most software, only the building role is filled</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .barg { fill: #d9d9d9; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .thin { fill: none; stroke: #bbb; stroke-width: 1; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowg); }
      .curveb { fill: none; stroke: #4a78b8; stroke-width: 2.5; }
      .curveo { fill: none; stroke: #d98a2b; stroke-width: 2.5; }
      .dotb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .doto { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="250" fill="#fff"/>
  <text x="250.0" y="30.0" text-anchor="middle">a building site</text>
  <text x="500.0" y="30.0" text-anchor="middle">most software</text>
  <text x="120.0" y="70.0" text-anchor="end">designs it and</text>
  <text class="small" x="120.0" y="86.0" text-anchor="end">signs off</text>
  <rect class="box blue" x="140" y="46" width="220" height="50" rx="4"/>
  <text x="250.0" y="67.5" text-anchor="middle">architect,</text>
  <text x="250.0" y="83.5" text-anchor="middle">structural engineer</text>
  <rect class="box" x="390" y="46" width="220" height="50" rx="4"/>
  <text x="500.0" y="75.5" text-anchor="middle">rarely anyone</text>
  <rect x="390" y="46" width="220" height="50" rx="4" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="120.0" y="142.0" text-anchor="end">builds it</text>
  <rect class="box blue" x="140" y="110" width="220" height="50" rx="4"/>
  <text x="250.0" y="139.5" text-anchor="middle">builders</text>
  <rect class="box blue" x="390" y="110" width="220" height="50" rx="4"/>
  <text x="500.0" y="139.5" text-anchor="middle">programmers</text>
  <text x="120.0" y="198.0" text-anchor="end">checks it</text>
  <text class="small" x="120.0" y="214.0" text-anchor="end">against a code</text>
  <rect class="box blue" x="140" y="174" width="220" height="50" rx="4"/>
  <text x="250.0" y="203.5" text-anchor="middle">inspectors</text>
  <rect class="box" x="390" y="174" width="220" height="50" rx="4"/>
  <text x="500.0" y="203.5" text-anchor="middle">mostly nobody</text>
  <rect x="390" y="174" width="220" height="50" rx="4" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 4"/>
</svg>
