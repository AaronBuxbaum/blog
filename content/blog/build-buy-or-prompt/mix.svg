<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-labelledby="t">
  <title id="t">A mix: plain code takes the requests with clear rules, a model takes the fuzzy ones, and a person checks the ones the model isn't sure about</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .barg { fill: #d9d9d9; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .thin { fill: none; stroke: #bbb; stroke-width: 1; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowg); }
      .curveb { fill: none; stroke: #4a78b8; stroke-width: 2.5; }
      .curveo { fill: none; stroke: #d98a2b; stroke-width: 2.5; }
      .dotb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .doto { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="240" fill="#fff"/>
  <rect class="box" x="10" y="98" width="90" height="44" rx="4"/>
  <text x="55.0" y="124.5" text-anchor="middle">request</text>
  <rect class="box" x="130" y="98" width="120" height="44" rx="4"/>
  <text x="190.0" y="124.5" text-anchor="middle">clear rule?</text>
  <rect class="box blue" x="300" y="30" width="130" height="44" rx="4"/>
  <text x="365.0" y="56.5" text-anchor="middle">plain code</text>
  <rect class="box orange" x="300" y="166" width="130" height="44" rx="4"/>
  <text x="365.0" y="192.5" text-anchor="middle">the model</text>
  <rect class="box" x="500" y="30" width="130" height="44" rx="4"/>
  <text x="565.0" y="56.5" text-anchor="middle">done</text>
  <rect class="box grey" x="500" y="166" width="130" height="44" rx="4"/>
  <text x="565.0" y="192.5" text-anchor="middle">a person checks</text>
  <path class="line" d="M 100.0 120.0 L 128.0 120.0"/>
  <path class="line" d="M 250 112 L 298 60"/>
  <text class="small" x="262.0" y="80.0" text-anchor="start">yes</text>
  <path class="line" d="M 250 128 L 298 180"/>
  <text class="small" x="262.0" y="168.0" text-anchor="start">no</text>
  <path class="line" d="M 430.0 52.0 L 498.0 52.0"/>
  <path class="line" d="M 430.0 180.0 L 498.0 66.0"/>
  <text class="small" x="470.0" y="112.0" text-anchor="middle">sure</text>
  <path class="line" d="M 430.0 196.0 L 498.0 196.0"/>
  <text class="small" x="464.0" y="212.0" text-anchor="middle">unsure</text>
  <path class="line" d="M 565.0 166.0 L 565.0 76.0"/>
</svg>
