<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" role="img" aria-labelledby="t">
  <title id="t">First-year savings by error rate. Prompting beats building and buying below about 1% wrong, and loses money above about 2.3%</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .barg { fill: #d9d9d9; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .thin { fill: none; stroke: #bbb; stroke-width: 1; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowg); }
      .curveb { fill: none; stroke: #4a78b8; stroke-width: 2.5; }
      .curveo { fill: none; stroke: #d98a2b; stroke-width: 2.5; }
      .dotb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .doto { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="310" fill="#fff"/>
  <path class="thin" d="M 90 240.0 L 600 240.0"/>
  <text class="small" x="82.0" y="244.0" text-anchor="end">-$20k</text>
  <path class="plain" d="M 90 190.0 L 600 190.0"/>
  <text class="small" x="82.0" y="194.0" text-anchor="end">$0k</text>
  <path class="thin" d="M 90 140.0 L 600 140.0"/>
  <text class="small" x="82.0" y="144.0" text-anchor="end">$20k</text>
  <path class="thin" d="M 90 90.0 L 600 90.0"/>
  <text class="small" x="82.0" y="94.0" text-anchor="end">$40k</text>
  <path class="thin" d="M 90 40.0 L 600 40.0"/>
  <text class="small" x="82.0" y="44.0" text-anchor="end">$60k</text>
  <path class="plain" d="M 90.0 240 L 90.0 245"/>
  <text class="small" x="90.0" y="259.0" text-anchor="middle">0%</text>
  <path class="plain" d="M 175.0 240 L 175.0 245"/>
  <text class="small" x="175.0" y="259.0" text-anchor="middle">0.5%</text>
  <path class="plain" d="M 260.0 240 L 260.0 245"/>
  <text class="small" x="260.0" y="259.0" text-anchor="middle">1%</text>
  <path class="plain" d="M 345.0 240 L 345.0 245"/>
  <text class="small" x="345.0" y="259.0" text-anchor="middle">1.5%</text>
  <path class="plain" d="M 430.0 240 L 430.0 245"/>
  <text class="small" x="430.0" y="259.0" text-anchor="middle">2%</text>
  <path class="plain" d="M 515.0 240 L 515.0 245"/>
  <text class="small" x="515.0" y="259.0" text-anchor="middle">2.5%</text>
  <path class="plain" d="M 600.0 240 L 600.0 245"/>
  <text class="small" x="600.0" y="259.0" text-anchor="middle">3%</text>
  <path class="plain" d="M 90 240 L 600 240"/>
  <path class="plain" d="M 90 40 L 90 240"/>
  <path class="dash" d="M 90 113.8 L 600 113.8"/>
  <text class="small" x="596.0" y="107.8" text-anchor="end">build (first year)</text>
  <path class="dash" d="M 90 119.4 L 600 119.4"/>
  <text class="small" x="596.0" y="133.4" text-anchor="end">buy</text>
  <path class="curveo" d="M 90.0 46.9 L 600.0 234.4"/>
  <text class="small" x="288.0" y="143.9" text-anchor="end">prompt</text>
  <circle class="doto" cx="175.0" cy="78.1" r="5"/>
  <text class="small" x="185.0" y="70.1" text-anchor="start">0.5%: saves $45k</text>
  <circle class="doto" cx="430.0" cy="171.9" r="5"/>
  <text class="small" x="440.0" y="163.9" text-anchor="start">2%: saves $7k</text>
  <circle class="dotb" cx="479.3" cy="190.0" r="4"/>
  <text class="small" x="471.3" y="206.0" text-anchor="end">break-even, 2.3%</text>
  <text x="345.0" y="286.0" text-anchor="middle">how often the model is wrong</text>
  <text class="small" x="20.0" y="26.0" text-anchor="start">savings in the first year, after every cost</text>
</svg>
