<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="t">
  <title id="t">Without getDataFromTree, each component renders and then fetches its own data, one after another; with it, the app renders once just to find the queries, sends one request, and renders again</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .barg { fill: #d9d9d9; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .thin { fill: none; stroke: #bbb; stroke-width: 1; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowg); }
      .curveb { fill: none; stroke: #4a78b8; stroke-width: 2.5; }
      .curveo { fill: none; stroke: #d98a2b; stroke-width: 2.5; }
      .dotb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .doto { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="250" fill="#fff"/>
  <text x="158.0" y="62.0" text-anchor="end">fetch in each</text>
  <text class="small" x="158.0" y="76.0" text-anchor="end">component</text>
  <rect class="barb" x="170.0" y="50.0" width="60.0" height="30.0"/>
  <text class="small" x="200.0" y="69.0" text-anchor="middle">render</text>
  <rect class="baro" x="230.0" y="50.0" width="70.0" height="30.0"/>
  <text class="small" x="265.0" y="69.0" text-anchor="middle">query A</text>
  <rect class="barb" x="300.0" y="50.0" width="50.0" height="30.0"/>
  <text class="small" x="325.0" y="69.0" text-anchor="middle">render</text>
  <rect class="baro" x="350.0" y="50.0" width="70.0" height="30.0"/>
  <text class="small" x="385.0" y="69.0" text-anchor="middle">query B</text>
  <rect class="barb" x="420.0" y="50.0" width="50.0" height="30.0"/>
  <text class="small" x="445.0" y="69.0" text-anchor="middle">render</text>
  <text x="158.0" y="132.0" text-anchor="end">getDataFromTree</text>
  <rect class="barb" x="170.0" y="120.0" width="110.0" height="30.0"/>
  <text class="small" x="225.0" y="139.0" text-anchor="middle">find queries</text>
  <rect class="baro" x="280.0" y="120.0" width="80.0" height="30.0"/>
  <text class="small" x="320.0" y="139.0" text-anchor="middle">one query</text>
  <rect class="barb" x="360.0" y="120.0" width="110.0" height="30.0"/>
  <text class="small" x="415.0" y="139.0" text-anchor="middle">render again</text>
  <path d="M 170 158 L 170 164 L 280 164 L 280 158" fill="none" stroke="#777" stroke-width="1.2"/>
  <text class="small" x="225.0" y="180.0" text-anchor="middle">a render that gets thrown away</text>
  <rect class="barb" x="170.0" y="216.0" width="14.0" height="14.0"/>
  <text class="small" x="190.0" y="228.0" text-anchor="start">rendering</text>
  <rect class="baro" x="310.0" y="216.0" width="14.0" height="14.0"/>
  <text class="small" x="330.0" y="228.0" text-anchor="start">waiting on the network</text>
  <text class="small" x="20.0" y="26.0" text-anchor="start">loading one page (lengths are illustrative)</text>
</svg>
