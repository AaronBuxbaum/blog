<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t">
  <title id="t">Dialing in: change one thing at a time. Sour means grind finer, bitter means grind coarser, weak means more coffee, strong means less coffee</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .barg { fill: #d9d9d9; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .thin { fill: none; stroke: #bbb; stroke-width: 1; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowg); }
      .curveb { fill: none; stroke: #4a78b8; stroke-width: 2.5; }
      .curveo { fill: none; stroke: #d98a2b; stroke-width: 2.5; }
      .dotb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .doto { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="300" fill="#fff"/>
  <rect class="box grey" x="250" y="125" width="140" height="50" rx="4"/>
  <text x="320.0" y="154.5" text-anchor="middle">taste it</text>
  <rect class="box orange" x="20" y="125" width="160" height="50" rx="4"/>
  <text x="100.0" y="147.0" text-anchor="middle">sour</text>
  <text class="small" x="100.0" y="163.0" text-anchor="middle">grind finer</text>
  <rect class="box orange" x="460" y="125" width="160" height="50" rx="4"/>
  <text x="540.0" y="147.0" text-anchor="middle">bitter</text>
  <text class="small" x="540.0" y="163.0" text-anchor="middle">grind coarser</text>
  <rect class="box blue" x="240" y="20" width="160" height="50" rx="4"/>
  <text x="320.0" y="42.0" text-anchor="middle">too strong</text>
  <text class="small" x="320.0" y="58.0" text-anchor="middle">less coffee</text>
  <rect class="box blue" x="240" y="230" width="160" height="50" rx="4"/>
  <text x="320.0" y="252.0" text-anchor="middle">too weak</text>
  <text class="small" x="320.0" y="268.0" text-anchor="middle">more coffee</text>
  <path class="line" d="M 250.0 150.0 L 182.0 150.0"/>
  <path class="line" d="M 390.0 150.0 L 458.0 150.0"/>
  <path class="line" d="M 320.0 125.0 L 320.0 72.0"/>
  <path class="line" d="M 320.0 175.0 L 320.0 228.0"/>
  <text class="small" x="470.0" y="230.0" text-anchor="start">brew again, with</text>
  <text class="small" x="470.0" y="244.0" text-anchor="start">everything else</text>
  <text class="small" x="470.0" y="258.0" text-anchor="start">held the same</text>
  <text class="small" x="20.0" y="230.0" text-anchor="start">orange: fix the grind</text>
  <text class="small" x="20.0" y="244.0" text-anchor="start">blue: fix the ratio</text>
</svg>
