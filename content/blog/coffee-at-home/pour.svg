<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t">
  <title id="t">The V60 recipe as the scale sees it: a 65g bloom, a fast circular pour to 300g by 1:15, a slow centre pour to 500g by 1:45, then drawdown until 3:00</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .barg { fill: #d9d9d9; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .thin { fill: none; stroke: #bbb; stroke-width: 1; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowg); }
      .curveb { fill: none; stroke: #4a78b8; stroke-width: 2.5; }
      .curveo { fill: none; stroke: #d98a2b; stroke-width: 2.5; }
      .dotb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .doto { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="300" fill="#fff"/>
  <path class="plain" d="M 70 240.0 L 610 240.0"/>
  <text class="small" x="62.0" y="244.0" text-anchor="end">0g</text>
  <path class="thin" d="M 70 202.0 L 610 202.0"/>
  <text class="small" x="62.0" y="206.0" text-anchor="end">100g</text>
  <path class="thin" d="M 70 164.0 L 610 164.0"/>
  <text class="small" x="62.0" y="168.0" text-anchor="end">200g</text>
  <path class="thin" d="M 70 126.0 L 610 126.0"/>
  <text class="small" x="62.0" y="130.0" text-anchor="end">300g</text>
  <path class="thin" d="M 70 88.0 L 610 88.0"/>
  <text class="small" x="62.0" y="92.0" text-anchor="end">400g</text>
  <path class="thin" d="M 70 50.0 L 610 50.0"/>
  <text class="small" x="62.0" y="54.0" text-anchor="end">500g</text>
  <path class="plain" d="M 70.0 240 L 70.0 245"/>
  <text class="small" x="70.0" y="259.0" text-anchor="middle">0:00</text>
  <path class="plain" d="M 160.0 240 L 160.0 245"/>
  <text class="small" x="160.0" y="259.0" text-anchor="middle">0:30</text>
  <path class="plain" d="M 205.0 240 L 205.0 245"/>
  <text class="small" x="205.0" y="259.0" text-anchor="middle">0:45</text>
  <path class="plain" d="M 250.0 240 L 250.0 245"/>
  <text class="small" x="250.0" y="259.0" text-anchor="middle">1:00</text>
  <path class="plain" d="M 295.0 240 L 295.0 245"/>
  <text class="small" x="295.0" y="259.0" text-anchor="middle">1:15</text>
  <path class="plain" d="M 340.0 240 L 340.0 245"/>
  <text class="small" x="340.0" y="259.0" text-anchor="middle">1:30</text>
  <path class="plain" d="M 385.0 240 L 385.0 245"/>
  <text class="small" x="385.0" y="259.0" text-anchor="middle">1:45</text>
  <path class="plain" d="M 430.0 240 L 430.0 245"/>
  <text class="small" x="430.0" y="259.0" text-anchor="middle">2:00</text>
  <path class="plain" d="M 520.0 240 L 520.0 245"/>
  <text class="small" x="520.0" y="259.0" text-anchor="middle">2:30</text>
  <path class="plain" d="M 610.0 240 L 610.0 245"/>
  <text class="small" x="610.0" y="259.0" text-anchor="middle">3:00</text>
  <path class="plain" d="M 70 50 L 70 240"/>
  <path class="curveb" d="M 70.0 240.0 L 94.0 215.3 L 205.0 215.3 L 295.0 126.0 L 385.0 50.0 L 610.0 50.0"/>
  <circle class="dotb" cx="205.0" cy="215.3" r="4"/>
  <circle class="dotb" cx="295.0" cy="126.0" r="4"/>
  <circle class="dotb" cx="385.0" cy="50.0" r="4"/>
  <text class="small" x="136.0" y="233.3" text-anchor="middle">bloom</text>
  <text class="small" x="241.0" y="152.6" text-anchor="end">circles,</text>
  <text class="small" x="241.0" y="166.6" text-anchor="end">agitate</text>
  <text class="small" x="328.0" y="72.8" text-anchor="end">slow, down the</text>
  <text class="small" x="328.0" y="86.8" text-anchor="end">middle</text>
  <text class="small" x="496.0" y="72.0" text-anchor="middle">swirl, then let it draw down</text>
  <text x="340.0" y="286.0" text-anchor="middle">time since you started the timer</text>
  <text class="small" x="20.0" y="30.0" text-anchor="start">what the scale reads</text>
</svg>
