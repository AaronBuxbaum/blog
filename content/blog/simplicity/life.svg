<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" aria-labelledby="t">
  <title id="t">The life of a line of code: an agent shrinks the writing, but the reviewing, debugging and changing cost what they always did</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .barg { fill: #d9d9d9; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .thin { fill: none; stroke: #bbb; stroke-width: 1; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowg); }
      .curveb { fill: none; stroke: #4a78b8; stroke-width: 2.5; }
      .curveo { fill: none; stroke: #d98a2b; stroke-width: 2.5; }
      .dotb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .doto { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="230" fill="#fff"/>
  <text x="140.0" y="71.0" text-anchor="end">before agents</text>
  <rect class="baro" x="155.0" y="50.0" width="130.0" height="32.0"/>
  <text class="small" x="220.0" y="71.0" text-anchor="middle">write</text>
  <rect class="barb" x="285.0" y="50.0" width="90.0" height="32.0"/>
  <text class="small" x="330.0" y="71.0" text-anchor="middle">review</text>
  <rect class="barb" x="375.0" y="50.0" width="110.0" height="32.0"/>
  <text class="small" x="430.0" y="71.0" text-anchor="middle">debug</text>
  <rect class="barb" x="485.0" y="50.0" width="130.0" height="32.0"/>
  <text class="small" x="550.0" y="71.0" text-anchor="middle">change</text>
  <text x="140.0" y="131.0" text-anchor="end">with an agent</text>
  <rect class="baro" x="155.0" y="110.0" width="14.0" height="32.0"/>
  <rect class="barb" x="169.0" y="110.0" width="90.0" height="32.0"/>
  <text class="small" x="214.0" y="131.0" text-anchor="middle">review</text>
  <rect class="barb" x="259.0" y="110.0" width="110.0" height="32.0"/>
  <text class="small" x="314.0" y="131.0" text-anchor="middle">debug</text>
  <rect class="barb" x="369.0" y="110.0" width="130.0" height="32.0"/>
  <text class="small" x="434.0" y="131.0" text-anchor="middle">change</text>
  <text class="small" x="155.0" y="158.0" text-anchor="start">^ write</text>
  <text class="small" x="20.0" y="210.0" text-anchor="start">an illustration, not a measurement</text>
  <rect class="baro" x="380.0" y="198.0" width="14.0" height="14.0"/>
  <text class="small" x="400.0" y="210.0" text-anchor="start">writing</text>
  <rect class="barb" x="480.0" y="198.0" width="14.0" height="14.0"/>
  <text class="small" x="500.0" y="210.0" text-anchor="start">everything after</text>
</svg>
