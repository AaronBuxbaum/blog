<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" role="img" aria-labelledby="t">
  <title id="t">A bad output becomes an eval case first; the small set runs on every prompt change and the big set runs before a release</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .barg { fill: #d9d9d9; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .thin { fill: none; stroke: #bbb; stroke-width: 1; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowg); }
      .curveb { fill: none; stroke: #4a78b8; stroke-width: 2.5; }
      .curveo { fill: none; stroke: #d98a2b; stroke-width: 2.5; }
      .dotb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .doto { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="262" fill="#fff"/>
  <rect class="box" x="10" y="40" width="130" height="56" rx="4"/>
  <text x="75.0" y="64.5" text-anchor="middle">a user sends</text>
  <text x="75.0" y="80.5" text-anchor="middle">a bad output</text>
  <rect class="box blue" x="170" y="40" width="130" height="56" rx="4"/>
  <text x="235.0" y="64.5" text-anchor="middle">add it to the</text>
  <text x="235.0" y="80.5" text-anchor="middle">eval set</text>
  <rect class="box orange" x="330" y="40" width="130" height="56" rx="4"/>
  <text x="395.0" y="64.5" text-anchor="middle">change the</text>
  <text x="395.0" y="80.5" text-anchor="middle">prompt</text>
  <rect class="box blue" x="490" y="40" width="140" height="56" rx="4"/>
  <text x="560.0" y="65.0" text-anchor="middle">small set</text>
  <text class="small" x="560.0" y="81.0" text-anchor="middle">every change</text>
  <rect class="box blue" x="490" y="160" width="140" height="56" rx="4"/>
  <text x="560.0" y="178.0" text-anchor="middle">big set</text>
  <text class="small" x="560.0" y="194.0" text-anchor="middle">before a release</text>
  <text class="small" x="560.0" y="208.0" text-anchor="middle">or model upgrade</text>
  <rect class="box" x="330" y="160" width="130" height="56" rx="4"/>
  <text x="395.0" y="192.5" text-anchor="middle">ship it</text>
  <path class="line" d="M 140.0 68.0 L 168.0 68.0"/>
  <path class="line" d="M 300.0 68.0 L 328.0 68.0"/>
  <path class="line" d="M 460.0 68.0 L 488.0 68.0"/>
  <path class="line" d="M 560.0 96.0 L 560.0 158.0"/>
  <text class="small" x="568.0" y="132.0" text-anchor="start">passes</text>
  <path class="line" d="M 490.0 188.0 L 462.0 188.0"/>
  <path class="dasharrow" d="M 560 40 C 560 6, 395 6, 395 38"/>
  <text class="small" x="478.0" y="34.0" text-anchor="middle">fails</text>
  <path class="dasharrow" d="M 560 216 C 560 255, 395 255, 395 218"/>
  <text class="small" x="478.0" y="232.0" text-anchor="middle">fails</text>
</svg>
