  <text class="small" x="64.0" y="178.0" text-anchor="middle">noise</text>
  <path class="line" d="M 120.0 100.0 L 136.0 100.0"/>
  <path class="dasharrow" d="M 128.0 196 L 128.0 104"/>
  <rect class="box" x="138" y="40" width="108" height="120" rx="4"/>
  <path class="plain" d="M 146.7 157.2 L 160.5 161.3 L 166.0 141.6 L 164.6 129.9 L 171.8 129.9 L 180.1 145.1 L 194.4 93.4 L 196.3 121.8 L 213.5 68.3 L 220.2 91.1 L 235.4 100.3 L 240.8 72.3"/>
  <text class="small" x="192.0" y="178.0" text-anchor="middle">step 1</text>
