  <rect class="baro" x="10.0" y="206.0" width="14.0" height="14.0"/>
  <text class="small" x="30.0" y="218.0" text-anchor="start">steering: a small nudge added to every step (dashed)</text>
  <text class="small" x="10.0" y="26.0" text-anchor="start">the action expert refines a path in small steps</text>
</svg>
