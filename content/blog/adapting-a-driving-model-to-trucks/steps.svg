  <text class="small" x="320.0" y="178.0" text-anchor="middle">step 2</text>
  <path class="line" d="M 376.0 100.0 L 392.0 100.0"/>
  <path class="dasharrow" d="M 384.0 196 L 384.0 104"/>
  <rect class="box" x="394" y="40" width="108" height="120" rx="4"/>
  <path class="plain" d="M 404.9 143.1 L 414.6 144.0 L 421.5 136.2 L 426.1 130.2 L 433.6 127.2 L 441.5 128.5 L 451.3 106.6 L 457.1 110.6 L 467.9 86.5 L 475.2 86.9 L 485.4 82.0 L 492.3 63.8"/>
  <text class="small" x="448.0" y="178.0" text-anchor="middle">step 3</text>
