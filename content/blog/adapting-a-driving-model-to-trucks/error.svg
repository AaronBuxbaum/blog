<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="t">
  <title id="t">Path error over 6.4 seconds falls from 2.64 off the shelf to 1.17 after adapting and 1.00 after steering</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="200" fill="#fff"/>
  <text class="small" x="20" y="26" text-anchor="start">path error over 6.4 seconds (lower is better)</text>
  <text x="150" y="67" text-anchor="end">off the shelf</text>
  <rect class="barb" x="162" y="46" width="396" height="32" rx="0"/>
  <text x="566" y="67" text-anchor="start">2.64</text>
  <text x="150" y="115" text-anchor="end">adapt</text>
  <rect class="baro" x="162" y="94" width="176" height="32" rx="0"/>
  <text x="346" y="115" text-anchor="start">1.17</text>
  <text x="150" y="163" text-anchor="end">adapt + steer</text>
  <rect class="baro" x="162" y="142" width="150" height="32" rx="0"/>
  <text x="320" y="163" text-anchor="start">1.00</text>
</svg>
