<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t">
  <title id="t">The agent keeps editing until lint and types pass; the inline disable comment is ignored, and a change to the lint config goes to a person</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .barg { fill: #d9d9d9; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .thin { fill: none; stroke: #bbb; stroke-width: 1; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowg); }
      .curveb { fill: none; stroke: #4a78b8; stroke-width: 2.5; }
      .curveo { fill: none; stroke: #d98a2b; stroke-width: 2.5; }
      .dotb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .doto { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="300" fill="#fff"/>
  <rect class="box orange" x="10" y="40" width="140" height="56" rx="4"/>
  <text x="80.0" y="64.5" text-anchor="middle">the agent</text>
  <text x="80.0" y="80.5" text-anchor="middle">edits code</text>
  <rect class="box blue" x="220" y="40" width="140" height="56" rx="4"/>
  <text x="290.0" y="64.5" text-anchor="middle">lint and</text>
  <text x="290.0" y="80.5" text-anchor="middle">type check</text>
  <rect class="box" x="470" y="40" width="150" height="56" rx="4"/>
  <text x="545.0" y="64.5" text-anchor="middle">a person</text>
  <text x="545.0" y="80.5" text-anchor="middle">reviews</text>
  <path class="line" d="M 150.0 68.0 L 218.0 68.0"/>
  <path class="line" d="M 360.0 68.0 L 468.0 68.0"/>
  <text class="small" x="414.0" y="60.0" text-anchor="middle">clean</text>
  <path class="line" d="M 290 96 C 290 140, 80 140, 80 98"/>
  <text class="small" x="185.0" y="145.0" text-anchor="middle">errors: read them, fix, run again</text>
  <text class="small" x="10.0" y="190.0" text-anchor="start">the shortcuts:</text>
  <rect class="box grey" x="10" y="200" width="200" height="36" rx="4"/>
  <text x="110.0" y="222.5" text-anchor="middle">// eslint-disable</text>
  <text class="small" x="222.0" y="223.0" text-anchor="start">ignored, with noInlineConfig</text>
  <rect class="box grey" x="10" y="250" width="200" height="36" rx="4"/>
  <text x="110.0" y="272.5" text-anchor="middle">edit the lint config</text>
  <path class="dasharrow" d="M 210 268 L 545 268 L 545 98"/>
  <text class="small" x="380.0" y="262.0" text-anchor="middle">a person has to read it</text>
</svg>
