<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t">
  <title id="t">The software turns a noisy signal into flashes, then groups the flashes into segments, then names each segment</title>
