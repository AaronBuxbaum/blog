  <rect class="barb" x="233" y="160" width="4" height="40"/>
  <rect class="barb" x="244" y="160" width="3" height="40"/>
  <rect class="barb" x="254" y="160" width="4" height="40"/>
  <rect class="barb" x="265" y="160" width="5" height="40"/>
  <rect class="barb" x="278" y="160" width="3" height="40"/>
