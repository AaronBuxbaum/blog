  <text x="20" y="266" text-anchor="start">3. split where</text>
  <text x="20" y="282" text-anchor="start">the rhythm</text>
  <text x="20" y="298" text-anchor="start">changes</text>
  <rect class="box grey" x="150" y="250" width="65" height="40" rx="0"/>
  <rect class="box orange" x="215" y="250" width="85" height="40" rx="0"/>
  <rect class="box orange" x="300" y="250" width="120" height="40" rx="0"/>
  <rect class="box orange" x="420" y="250" width="85" height="40" rx="0"/>
  <rect class="box orange" x="505" y="250" width="117" height="40" rx="0"/>
  <path class="dash" d="M 215 50 L 215 250"/>
  <path class="dash" d="M 300 50 L 300 250"/>
  <path class="dash" d="M 420 50 L 420 250"/>
  <path class="dash" d="M 505 50 L 505 250"/>
  <text x="20" y="346" text-anchor="start">4. name each</text>
  <text x="20" y="362" text-anchor="start">segment</text>
  <text class="small" x="182.5" y="275" text-anchor="middle">quiet</text>
  <text x="257.5" y="275" text-anchor="middle">R</text>
  <text class="small" x="257.5" y="346" text-anchor="middle">arginine</text>
  <text class="small" x="257.5" y="360" text-anchor="middle">short</text>
  <path class="plain" d="M 257.5 292 L 257.5 332"/>
  <text x="360.0" y="275" text-anchor="middle">L</text>
  <text class="small" x="360.0" y="346" text-anchor="middle">leucine</text>
  <text class="small" x="360.0" y="360" text-anchor="middle">long</text>
  <path class="plain" d="M 360.0 292 L 360.0 332"/>
  <text x="462.5" y="275" text-anchor="middle">I</text>
  <text class="small" x="462.5" y="346" text-anchor="middle">isoleucine</text>
  <text class="small" x="462.5" y="360" text-anchor="middle">short</text>
  <path class="plain" d="M 462.5 292 L 462.5 332"/>
  <text x="563.5" y="275" text-anchor="middle">F</text>
  <text class="small" x="563.5" y="346" text-anchor="middle">phenylalanine</text>
  <text class="small" x="563.5" y="360" text-anchor="middle">longest</text>
  <path class="plain" d="M 563.5 292 L 563.5 332"/>
  <text class="small" x="20" y="26" text-anchor="start">one well, reading a piece of the peptide DQQRLIFAG (drawn by hand, not real data)</text>
  <text class="small" x="20" y="392" text-anchor="start">D and Q have no recognizer, so the read starts with a quiet stretch.</text>
