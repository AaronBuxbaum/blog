.5 L 504 99.0 L 506 95.2 L 508 90.9 L 510 99.5 L 512 61.1 L 514 67.6 L 516 70.0 L 518 61.9 L 520 61.9 L 522 69.5 L 524 66.4 L 526 58.6 L 528 58.0 L 530 58.3 L 532 68.8 L 534 67.4 L 536 58.1 L 538 67.6 L 540 69.8 L 542 65.2 L 544 60.9 L 546 63.6 L 548 57.8 L 550 56.1 L 552 69.5 L 554 97.0 L 556 95.2 L 558 100.9 L 560 93.9 L 562 100.0 L 564 99.3 L 566 58.7 L 568 59.2 L 570 59.8 L 572 59.0 L 574 63.8 L 576 59.2 L 578 61.4 L 580 57.4 L 582 68.2 L 584 60.4 L 586 61.9 L 588 63.6 L 590 68.1 L 592 61.3 L 594 68.2 L 596 62.4 L 598 62.8 L 600 94.6 L 602 87.5 L 604 93.4 L 606 89.8 L 608 87.2 L 610 98.3 L 612 89.5 L 614 93.7 L 616 97.2 L 618 94.8 L 620 91.6" fill="none" stroke="#222" stroke-width="1"/>
  <text x="20" y="176" text-anchor="start">2. find the</text>
  <text x="20" y="192" text-anchor="start">flashes</text>
