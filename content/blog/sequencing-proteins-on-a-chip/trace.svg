<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="t">
  <title id="t">Light from one well over time: long flashes, then short flashes, then medium flashes, separated by cuts</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="250" fill="#fff"/>
  <text class="small" x="20" y="26" text-anchor="start">light from one well</text>
  <path class="line" d="M 20 150 L 622 150"/>
  <text class="small" x="622" y="166" text-anchor="end">time</text>
  <rect class="barb" x="40" y="80" width="30" height="70" rx="0"/>
  <rect class="barb" x="82" y="80" width="30" height="70" rx="0"/>
  <rect class="barb" x="124" y="80" width="30" height="70" rx="0"/>
  <rect class="barb" x="166" y="80" width="30" height="70" rx="0"/>
  <rect class="barb" x="270" y="80" width="5" height="70" rx="0"/>
  <rect class="barb" x="284" y="80" width="5" height="70" rx="0"/>
  <rect class="barb" x="298" y="80" width="5" height="70" rx="0"/>
  <rect class="barb" x="312" y="80" width="5" height="70" rx="0"/>
  <rect class="barb" x="326" y="80" width="5" height="70" rx="0"/>
  <rect class="barb" x="340" y="80" width="5" height="70" rx="0"/>
  <rect class="barb" x="354" y="80" width="5" height="70" rx="0"/>
  <rect class="barb" x="368" y="80" width="5" height="70" rx="0"/>
  <rect class="barb" x="382" y="80" width="5" height="70" rx="0"/>
  <rect class="barb" x="460" y="80" width="11" height="70" rx="0"/>
  <rect class="barb" x="482" y="80" width="11" height="70" rx="0"/>
  <rect class="barb" x="504" y="80" width="11" height="70" rx="0"/>
  <rect class="barb" x="526" y="80" width="11" height="70" rx="0"/>
  <rect class="barb" x="548" y="80" width="11" height="70" rx="0"/>
  <rect class="barb" x="570" y="80" width="11" height="70" rx="0"/>
  <path class="dash" d="M 240 60 L 240 184"/>
  <text class="small" x="240" y="52" text-anchor="middle">cut</text>
  <path class="dash" d="M 430 60 L 430 184"/>
  <text class="small" x="430" y="52" text-anchor="middle">cut</text>
  <text x="118" y="190" text-anchor="middle">phenylalanine</text>
  <text class="small" x="118" y="206" text-anchor="middle">long flashes</text>
  <text x="328" y="190" text-anchor="middle">tryptophan</text>
  <text class="small" x="328" y="206" text-anchor="middle">short flashes</text>
  <text x="520" y="190" text-anchor="middle">tyrosine</text>
  <text class="small" x="520" y="206" text-anchor="middle">medium flashes</text>
  <text class="small" x="320" y="238" text-anchor="middle">One recognizer, three amino acids. The rhythm tells them apart.</text>
</svg>
