<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t">
  <title id="t">A peptide anchored at the bottom of a well, with a dye-labeled recognizer binding its end amino acid and an aminopeptidase that cuts the end off</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="330" fill="#fff"/>
  <path d="M 20 96 L 220 96 L 220 262 L 420 262 L 420 96 L 620 96 L 620 300 L 20 300 Z" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/>
  <text x="120" y="200" text-anchor="middle">chip</text>
  <text x="520" y="200" text-anchor="middle">chip</text>
  <text class="small" x="320" y="286" text-anchor="middle">light sensor underneath</text>
  <path class="plain" d="M 320 262 L 320 136"/>
  <circle cx="320" cy="244" r="11" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="320" y="248" text-anchor="middle">A</text>
  <circle cx="320" cy="220" r="11" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="320" y="224" text-anchor="middle">W</text>
  <circle cx="320" cy="196" r="11" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="320" y="200" text-anchor="middle">A</text>
  <circle cx="320" cy="172" r="11" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="320" y="176" text-anchor="middle">A</text>
  <circle cx="320" cy="136" r="11" fill="#f0b775" stroke="#222" stroke-width="1.2"/>
  <text x="320" y="140" text-anchor="middle">F</text>
  <text class="small" x="336" y="254" text-anchor="start">anchor</text>
  <text class="small" x="336" y="200" text-anchor="start">peptide</text>
  <path d="M 320 122 A 14 14 0 0 0 320 150 L 320 160 A 24 24 0 0 1 320 112 Z" fill="#9db8e0" stroke="#222" stroke-width="1.2"/>
  <path class="plain" d="M 277 136 L 296 136"/>
  <polygon points="268.0,127.0 270.4,132.8 276.6,133.2 271.8,137.2 273.3,143.3 268.0,140.0 262.7,143.3 264.2,137.2 259.4,133.2 265.6,132.8" fill="#f0b775" stroke="#222" stroke-width="1.2"/>
  <text x="20" y="30" text-anchor="start">recognizer, with a dye</text>
  <text class="small" x="20" y="48" text-anchor="start">grabs the end amino acid,</text>
  <text class="small" x="20" y="62" text-anchor="start">lets go, and grabs it again</text>
  <path class="dasharrow" d="M 200 44 L 258 128"/>
  <path d="M 262 60 A 12 12 0 0 1 286 60 L 298 60 A 24 24 0 0 0 250 60 Z" fill="#9db8e0" stroke="#222" stroke-width="1.2"/>
  <rect class="box" x="440" y="20" width="150" height="36" rx="18"/>
  <text x="515" y="43" text-anchor="middle">aminopeptidase</text>
  <path class="dasharrow" d="M 450 54 L 338 128"/>
  <text class="small" x="440" y="74" text-anchor="start">every so often, cuts</text>
  <text class="small" x="440" y="88" text-anchor="start">the end amino acid off</text>
  <text class="small" x="320" y="322" text-anchor="middle">Not to scale.</text>
</svg>
