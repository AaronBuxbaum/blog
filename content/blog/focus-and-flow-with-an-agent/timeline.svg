<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t">
  <title id="t">One hour with an agent, spent two ways: switching to Slack and e-mail in every gap, or staying on the same task through the gaps</title>
