<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-labelledby="t">
  <title id="t">Half an hour of attention with one agent versus four: every switch between agents costs time spent remembering what that task was about</title>
  <defs>
