<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-labelledby="t">
  <title id="t">Software sorted by what a mistake costs: craft on the cheap end, engineering on the expensive end</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .barg { fill: #d9d9d9; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .thin { fill: none; stroke: #bbb; stroke-width: 1; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowg); }
      .curveb { fill: none; stroke: #4a78b8; stroke-width: 2.5; }
      .curveo { fill: none; stroke: #d98a2b; stroke-width: 2.5; }
      .dotb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .doto { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="240" fill="#fff"/>
  <rect class="box blue" x="20.0" y="40.0" width="300.0" height="110.0"/>
  <rect class="box orange" x="320.0" y="40.0" width="300.0" height="110.0"/>
  <text x="170.0" y="62.0" text-anchor="middle">craft</text>
  <text x="470.0" y="62.0" text-anchor="middle">engineering</text>
  <path class="line" d="M 30.0 110.0 L 612.0 110.0"/>
  <circle class="dotb" cx="60.0" cy="110.0" r="4"/>
  <text class="small" x="60.0" y="95.0" text-anchor="middle">a prototype</text>
  <circle class="dotb" cx="140.0" cy="110.0" r="4"/>
  <text class="small" x="140.0" y="134.0" text-anchor="middle">an internal tool</text>
  <circle class="dotb" cx="240.0" cy="110.0" r="4"/>
  <text class="small" x="240.0" y="95.0" text-anchor="middle">a marketing site</text>
  <circle class="doto" cx="380.0" cy="110.0" r="4"/>
  <text class="small" x="380.0" y="95.0" text-anchor="middle">billing</text>
  <circle class="doto" cx="470.0" cy="110.0" r="4"/>
  <text class="small" x="470.0" y="134.0" text-anchor="middle">medical records</text>
  <circle class="doto" cx="570.0" cy="110.0" r="4"/>
  <text class="small" x="570.0" y="95.0" text-anchor="middle">a vehicle</text>
  <text class="small" x="612.0" y="166.0" text-anchor="end">what a mistake costs -&gt;</text>
  <text class="small" x="170.0" y="192.0" text-anchor="middle">move as fast as</text>
  <text class="small" x="170.0" y="206.0" text-anchor="middle">the tools allow</text>
  <text class="small" x="470.0" y="192.0" text-anchor="middle">a named person signs off,</text>
  <text class="small" x="470.0" y="206.0" text-anchor="middle">written standards, and tests</text>
  <text class="small" x="470.0" y="220.0" text-anchor="middle">an agent can't weaken</text>
</svg>
