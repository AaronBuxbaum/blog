<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t">
  <title id="t">Speed, safety and knowledge dissemination, and what changes in each when an agent writes the code</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <style>
      text { font-family: monospace; font-size: 13px; fill: #222; }
      .small { font-size: 11px; fill: #555; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .blue { fill: #eef3fb; }
      .orange { fill: #fdf1e3; }
      .grey { fill: #f1f1f1; }
      .barb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .baro { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
      .barg { fill: #d9d9d9; stroke: #222; stroke-width: 1.2; }
      .line { fill: none; stroke: #222; stroke-width: 1.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #222; stroke-width: 1.5; }
      .thin { fill: none; stroke: #bbb; stroke-width: 1; }
      .dash { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dasharrow { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#arrowg); }
      .curveb { fill: none; stroke: #4a78b8; stroke-width: 2.5; }
      .curveo { fill: none; stroke: #d98a2b; stroke-width: 2.5; }
      .dotb { fill: #9db8e0; stroke: #222; stroke-width: 1.2; }
      .doto { fill: #f0b775; stroke: #222; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="300" fill="#fff"/>
  <path class="plain" d="M 300 72 L 140 224"/>
  <path class="plain" d="M 340 72 L 500 224"/>
  <path class="plain" d="M 190 245 L 450 245"/>
  <rect class="box blue" x="250" y="30" width="140" height="42" rx="4"/>
  <text x="320.0" y="55.5" text-anchor="middle">speed</text>
  <rect class="box orange" x="40" y="224" width="150" height="42" rx="4"/>
  <text x="115.0" y="249.5" text-anchor="middle">safety</text>
  <rect class="box grey" x="450" y="224" width="150" height="42" rx="4"/>
  <text x="525.0" y="249.5" text-anchor="middle">knowledge</text>
  <text class="small" x="400.0" y="46.0" text-anchor="start">writing is close to free,</text>
  <text class="small" x="400.0" y="60.0" text-anchor="start">so review is the bottleneck</text>
  <text class="small" x="115.0" y="284.0" text-anchor="middle">confident code hides its mistakes</text>
  <text class="small" x="525.0" y="284.0" text-anchor="middle">maybe nobody understands it</text>
  <text x="320.0" y="196.0" text-anchor="middle">an agent writes the PR</text>
  <text class="small" x="320.0" y="212.0" text-anchor="middle">and doesn't mind twelve comments</text>
</svg>
